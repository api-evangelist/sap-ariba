naftiko: 1.0.0-alpha2
info:
  label: SAP Ariba Procurement API — Requisitions
  description: 'SAP Ariba Procurement API — Requisitions. 3 operations. Lead operation: List Requisitions. Self-contained
    Naftiko capability covering one Sap Ariba business surface.'
  tags:
  - Sap Ariba
  - Requisitions
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SAP_ARIBA_API_KEY: SAP_ARIBA_API_KEY
capability:
  consumes:
  - type: http
    namespace: procurement-requisitions
    baseUri: https://openapi.ariba.com/api/procurement/v1
    description: SAP Ariba Procurement API — Requisitions business capability. Self-contained, no shared references.
    resources:
    - name: requisitions
      path: /requisitions
      operations:
      - name: listrequisitions
        method: GET
        description: List Requisitions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: filter
          in: query
          type: string
          description: OData-style filter expression
        - name: status
          in: query
          type: string
          description: Filter by requisition status
        - name: requestor
          in: query
          type: string
          description: Filter by requestor user ID
      - name: createrequisition
        method: POST
        description: Create a Requisition
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: requisitions-requisitionId
      path: /requisitions/{requisitionId}
      operations:
      - name: getrequisition
        method: GET
        description: Get a Requisition
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: requisitionId
          in: path
          type: string
          description: Unique identifier for the requisition
          required: true
    authentication:
      type: bearer
      token: '{{env.SAP_ARIBA_API_KEY}}'
  exposes:
  - type: rest
    namespace: procurement-requisitions-rest
    port: 8080
    description: REST adapter for SAP Ariba Procurement API — Requisitions. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/requisitions
      name: requisitions
      description: REST surface for requisitions.
      operations:
      - method: GET
        name: listrequisitions
        description: List Requisitions
        call: procurement-requisitions.listrequisitions
        with:
          filter: rest.filter
          status: rest.status
          requestor: rest.requestor
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createrequisition
        description: Create a Requisition
        call: procurement-requisitions.createrequisition
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/requisitions/{requisitionid}
      name: requisitions-requisitionid
      description: REST surface for requisitions-requisitionId.
      operations:
      - method: GET
        name: getrequisition
        description: Get a Requisition
        call: procurement-requisitions.getrequisition
        with:
          requisitionId: rest.requisitionId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: procurement-requisitions-mcp
    port: 9090
    transport: http
    description: MCP adapter for SAP Ariba Procurement API — Requisitions. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: list-requisitions
      description: List Requisitions
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: procurement-requisitions.listrequisitions
      with:
        filter: tools.filter
        status: tools.status
        requestor: tools.requestor
      outputParameters:
      - type: object
        mapping: $.
    - name: create-requisition
      description: Create a Requisition
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: procurement-requisitions.createrequisition
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-requisition
      description: Get a Requisition
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: procurement-requisitions.getrequisition
      with:
        requisitionId: tools.requisitionId
      outputParameters:
      - type: object
        mapping: $.
