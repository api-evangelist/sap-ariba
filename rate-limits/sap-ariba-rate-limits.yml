specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: SAP Ariba
providerId: sap-ariba
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Rate Limiting
  - B2B
  - Contract Management
  - Procurement
  - Sourcing
  - Spend Analysis
  - Supplier Management
  - Supply Chain
description: SAP Ariba APIs are partner-gated through the SAP Ariba developer portal; rate-limit numbers are documented per API package (Realm Notification, Operational Reporting, etc.) inside the partner portal rather than on a public page.
sources:
  - https://www.ariba.com
  - https://www.sap.com/products/spend-management/ariba.html
notes: Provider documentation pages render via client-side JavaScript or sit behind a partner portal; static rate-limit numbers are not exposed to automated fetches. Reconcile from the per-product SAP Help Portal section or partner developer portal.
responseCodes:
  throttled: 429
limits:
  - name: Per-service quotas
    scope: account/region/service
    metric: varies
    limit: see provider documentation; gated or partner-only
policies:
  - name: Documentation location
    description: Rate limits are documented per service in the SAP Help Portal or the SAP Concur developer
      portal; consult the relevant section for current numbers.
  - name: Contract-governed
    description: Effective limits depend on the customer's BTP entitlement, partner application, or negotiated
      contract.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
